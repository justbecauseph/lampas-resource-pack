name: Publish Resource Pack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Package and Publish
    runs-on: ubuntu-latest
    env:
      VERSION: v0.0.${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Package Resource Pack
        run: |
          # Build a list of files/folders to include in the zip
          zip_files="assets pack.mcmeta"
          
          # Include pack.png if it exists
          if [ -f "pack.png" ]; then
            zip_files="$zip_files pack.png"
          fi
          
          # Create zip archive named after the version
          zip -r "lampas-resource-pack-$VERSION.zip" $zip_files

      - name: Calculate SHA-1 Hash
        run: |
          sha1_value=$(sha1sum "lampas-resource-pack-$VERSION.zip" | cut -d' ' -f1)
          echo "SHA1=$sha1_value" >> $GITHUB_ENV
          echo "Calculated SHA-1: $sha1_value"

      - name: Configure Git User
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create and Push Version Tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create Versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Copy to a static filename so the releases/latest/download link works
          cp "lampas-resource-pack-$VERSION.zip" "lampas-resource-pack.zip"
          
          gh release create "$VERSION" \
            "lampas-resource-pack-$VERSION.zip" \
            "lampas-resource-pack.zip" \
            --title "Release $VERSION" \
            --notes "### Release $VERSION
            
          **SHA-1 Hash:** \`$SHA1\`
          
          **Suggested server.properties:**
          \`\`\`properties
          resource-pack=https://github.com/justbecauseph/lampas-resource-pack/releases/latest/download/lampas-resource-pack.zip
          resource-pack-sha1=$SHA1
          resource-pack-prompt={\"text\":\"The Lampas resource pack\"}
          resource-pack-id=bf814f2d-c205-40cd-8ee9-c49c2e268781
          \`\`\`"

